<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión / Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="login-styles.css">
</head>
<body>
    <div class="container">
        <div class="form-box1" id="login-box">
            <h2><i class="fa fa-sign-in" aria-hidden="true"></i> Inicio de Sesión</h2><br>
            <form>
                <div class="input-box">
                    <label for="login-username">Nombre de Usuario</label>
                    <input type="text" id="login-username" placeholder="Tu Nombre de Usuario"><br>
                </div>
                <div class="input-box">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="********"><br>
                </div><br>
                <div class="actions">
                    <button type="button" onclick="login()">Iniciar Sesión</button>
                </div>
                <h2><i class="fa fa-users" aria-hidden="true"></i></h2>
                <div class="switch">
                    <button type="button" onclick="showRegister()">Registrar Nueva Cuenta</button>
                </div>
            </form>
        </div>
        <div class="form-box2" id="register-box" style="display:none;">
            <h2><i class="fa fa-user-plus" aria-hidden="true"></i> Registro de Usuario</h2>
            <form>
                <div class="input-box">
                    <label for="register-username">Nombre de Usuario</label>
                    <input type="text" id="register-username" placeholder="Tu Nombre de Usuario">
                </div>
                <div class="input-box">
                    <label for="register-password">Contraseña</label>
                    <input type="password" id="register-password" placeholder="********">
                </div>
                <div class="input-box">
                    <label for="register-confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="register-confirm-password" placeholder="********">
                </div>
                <div class="input-box">
                    <label for="special-password">Contraseña Especial</label>
                    <input type="password" id="special-password" placeholder="Contraseña Especial">
                </div>
                <div class="actions">
                    <button type="button" onclick="register()">Registrarse</button>
                </div>
                <div class="switch">
                    <button type="button" onclick="showLogin()">Iniciar Sesión</button>
                </div>
            </form>
        </div>
        <div class="image-container">
            <img src="img/prueba1.jpg" alt="Imagen de la Empresa1">
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Acueducto de Aranda. Todos los derechos reservados. | <a href="#">Términos de Servicio</a> | <a href="#">Política de Privacidad</a> | <a href="#">Contacto</a></p>
    </footer>


    <script>
        // Datos estáticos para comprobar la funcionalidad
        const validUsername = "usuario";
        const validPassword = "password123";
        const specialPassword = "12345"; // Contraseña especial

        function showRegister() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('register-box').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('register-box').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        }
        function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (username === validUsername && password === validPassword) {
                alert("Inicio de sesión exitoso.");
                // Redirigir al usuario al menú principal
                 window.location.href = "menu.html"; // Descomentar para redirigir
            } else {
                alert("Nombre de usuario o contraseña incorrectos.");
            }
        }

        function register() {
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const specialPwd = document.getElementById('special-password').value;

            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            if (specialPwd !== specialPassword) {
                alert("Contraseña especial incorrecta. No se puede registrar.");
                return;
            }

            alert("Registro exitoso.");
            // Aquí añadir la lógica de registro
            // En una implementación real, enviar los datos al servidor para registrar el usuario
        }
    </script>
</body>
</html>
